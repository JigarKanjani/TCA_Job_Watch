name: JobWatch worker

on:
  schedule:
    - cron: "23,53 * * * *"   # every 30 min: scrape what's due, deliver what's in-window
  workflow_dispatch:
    inputs:
      phase:
        description: "Which phase to run"
        type: choice
        options: [all, scrape, deliver, briefs]
        default: all

concurrency:
  group: jobwatch-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: worker/requirements.txt

      - name: Install
        run: pip install -r worker/requirements.txt

      - name: Run
        env:
          # Public values (safe to commit)
          SUPABASE_URL: https://wtzsmaejnobavhvwwttd.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_f81XpYweDRPTum-iMc3OQg_eW2IHUey
          SITE_URL: ${{ vars.SITE_URL }}
          # Secrets — add under Settings → Secrets and variables → Actions
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python worker/run_alerts.py "${{ inputs.phase || 'all' }}"
